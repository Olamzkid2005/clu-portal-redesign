<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 560" role="img" aria-labelledby="title desc">
  <title id="title">Seated student illustration</title>
  <desc id="desc">The student sits on a card edge with her legs hanging down, one hand resting beside her and the other raised in a wave.</desc>
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a96845"/>
      <stop offset=".48" stop-color="#874b30"/>
      <stop offset="1" stop-color="#5c2c1c"/>
    </linearGradient>
    <linearGradient id="skinArm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b5744e"/>
      <stop offset="1" stop-color="#7c4028"/>
    </linearGradient>
    <linearGradient id="hoodie" x1=".1" y1="0" x2=".9" y2="1" color-interpolation="linearRGB">
      <stop offset="0" stop-color="#4b3e58"/>
      <stop offset=".22" stop-color="#352b41"/>
      <stop offset=".52" stop-color="#241e2d"/>
      <stop offset=".78" stop-color="#17131f"/>
      <stop offset="1" stop-color="#0f0c14"/>
    </linearGradient>
    <linearGradient id="hoodieLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a3e58"/>
      <stop offset="1" stop-color="#2a2333"/>
    </linearGradient>
    <linearGradient id="hair" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#382128"/>
      <stop offset=".55" stop-color="#1f1418"/>
      <stop offset="1" stop-color="#0f0b0e"/>
    </linearGradient>
    <linearGradient id="hairCurl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b2d33"/>
      <stop offset="1" stop-color="#241519"/>
    </linearGradient>
    <radialGradient id="cheek" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#d98b68" stop-opacity=".55"/>
      <stop offset="1" stop-color="#d98b68" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".45" r=".5">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity=".75"/>
      <stop offset="1" stop-color="#c4b5fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <linearGradient id="pantsGrad" x1="0" y1="0" x2="1" y2="1" color-interpolation="linearRGB">
      <stop offset="0" stop-color="#55445f"/><stop offset=".25" stop-color="#3b3046"/><stop offset=".58" stop-color="#2a2231"/><stop offset=".82" stop-color="#1e1825"/><stop offset="1" stop-color="#15111b"/>
    </linearGradient>
    <linearGradient id="shoeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdfa"/><stop offset=".65" stop-color="#f2e6e0"/><stop offset="1" stop-color="#d9c4bf"/>
    </linearGradient>
    <linearGradient id="soleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5665"/><stop offset="1" stop-color="#5b2e3e"/>
    </linearGradient>
    <filter id="legSoft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="faceSoft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="contactSoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <linearGradient id="pantsLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a7893" stop-opacity="0"/><stop offset=".5" stop-color="#9d89a6" stop-opacity=".8"/><stop offset="1" stop-color="#8a7893" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- seated lower body: legs hang over the card edge -->
  <g id="seated-legs">
    <ellipse cx="224" cy="381" rx="126" ry="17" fill="#2b1620" opacity=".24" filter="url(#contactSoft)"/>
    <ellipse cx="224" cy="394" rx="82" ry="8" fill="#2b1620" opacity=".16" filter="url(#contactSoft)"/>

    <path d="M190 350C166 380 146 412 141 448c-5 29 0 52 8 66" fill="none" stroke="url(#pantsGrad)" stroke-width="57" stroke-linecap="round"/>
    <path d="M258 350c24 30 44 62 49 98 5 29 0 52-8 66" fill="none" stroke="url(#pantsGrad)" stroke-width="59" stroke-linecap="round"/>
    <path d="M176 374c-9 27-13 54-11 80 1 22 5 40 11 53" fill="none" stroke="#78677d" stroke-width="7" stroke-linecap="round" opacity=".28"/>
    <path d="M272 374c9 27 13 54 11 80-1 22-5 40-11 53" fill="none" stroke="#8a778e" stroke-width="6" stroke-linecap="round" opacity=".18"/>

    <path d="M188 360c-15 28-27 57-31 86" fill="none" stroke="url(#pantsLight)" stroke-width="9" stroke-linecap="round" opacity=".55"/>
    <path d="M260 360c15 28 27 57 31 86" fill="none" stroke="url(#pantsLight)" stroke-width="8" stroke-linecap="round" opacity=".35"/>


    <!-- seated lap: compact bridge between the thighs -->
    <path d="M174 372c14-7 30-10 46-10s32 3 46 10c7 4 8 12 2 18-10 8-28 12-48 12s-38-4-48-12c-6-6-5-14 2-18z" fill="url(#pantsGrad)"/>


    <ellipse cx="150" cy="535" rx="35" ry="7" fill="#3b2a34" opacity=".18" filter="url(#legSoft)"/>
    <ellipse cx="295" cy="540" rx="37" ry="7" fill="#3b2a34" opacity=".16" filter="url(#legSoft)"/>
    <g transform="translate(106 501) rotate(-10)">
      <path d="M4 22c0-10 8-17 19-17h18c10 0 18 6 20 15l3 10c1 5-2 9-8 9H13c-6 0-10-4-9-10z" fill="url(#shoeGrad)"/>
      <path d="M2 30h70c1 5-4 9-10 9H13c-5 0-9-4-11-9z" fill="url(#soleGrad)"/>
      <path d="M24 9c3 5 3 10 1 16M35 9c3 5 3 10 1 16" fill="none" stroke="#b6a3a0" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M8 24h58" stroke="#d3bfba" stroke-width="1.6" opacity=".8"/>
      <path d="M18 15c9-4 20-4 29 0M20 19c8-3 17-3 25 0M23 23c7-2 14-2 21 0" fill="none" stroke="#a8918d" stroke-width="1.8" stroke-linecap="round" opacity=".75"/>

    </g>
    <g transform="translate(268 506) rotate(10)">
      <path d="M4 22c0-10 8-17 19-17h18c10 0 18 6 20 15l3 10c1 5-2 9-8 9H13c-6 0-10-4-9-10z" fill="url(#shoeGrad)"/>
      <path d="M2 30h70c1 5-4 9-10 9H13c-5 0-9-4-11-9z" fill="url(#soleGrad)"/>
      <path d="M24 9c3 5 3 10 1 16M35 9c3 5 3 10 1 16" fill="none" stroke="#b6a3a0" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M8 24h58" stroke="#d3bfba" stroke-width="1.6" opacity=".8"/>
      <path d="M18 15c9-4 20-4 29 0M20 19c8-3 17-3 25 0M23 23c7-2 14-2 21 0" fill="none" stroke="#a8918d" stroke-width="1.8" stroke-linecap="round" opacity=".75"/>

    </g>
  </g>
  <g transform="translate(41 -18) scale(0.9)">



